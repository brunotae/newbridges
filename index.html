<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Bridges · Brasil · China · Mundo</title>
<meta name="description" content="New Bridges — comércio exterior entre Brasil, China e outros países: pesquisa de mercado, fornecedores, feiras, compra e venda, inspeção, logística e estruturação.">
<meta name="theme-color" content="#060A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="New Bridges">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#060A16;--s1:#0C1326;--s2:#121B33;--s3:#18233F;--ln:#22304F;--tx:#EEF2FA;--mu:#8E9BB8;--gold:#D9B46A;--gold2:#F0D79C;--teal:#3FC1B0;--red:#FF6B6B;--amber:#F5B547;--green:#46C98B;--blue:#6EA8FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;font-size:13px;line-height:1.45;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
a{color:var(--gold2);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--tx)}
.glow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
.glow i:nth-child(1){width:520px;height:520px;background:#1D4E89;top:-180px;left:-160px}
.glow i:nth-child(2){width:420px;height:420px;background:#7A5A1E;bottom:-160px;right:-120px;opacity:.28}
.glow i:nth-child(3){width:300px;height:300px;background:#145B57;top:40%;left:45%;opacity:.18}
.logo{font-weight:900;letter-spacing:.5px;font-size:18px;white-space:nowrap}
.logo b{color:transparent;-webkit-text-stroke:1.2px var(--gold);font-weight:900;margin-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border-radius:999px;background:var(--gold);color:#1A1405;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--gold2)}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.sec:hover{border-color:var(--gold)}
.btn.sm{min-height:30px;padding:0 12px;font-size:12px}
.btn.red{background:transparent;color:var(--red);border:1px solid #5A2A33}
.btn.red.arm{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* ============ SITE ============ */
#site{position:relative;z-index:1}
.snav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px max(16px,env(safe-area-inset-left));background:rgba(6,10,22,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(34,48,79,.6)}
.snav .links{display:flex;gap:18px;margin-left:auto}
.snav .links a{color:var(--mu);font-size:13px}
.snav .links a:hover{color:var(--tx)}
.lang{display:flex;border:1px solid var(--ln);border-radius:999px;overflow:hidden}
.lang button{padding:4px 9px;font-size:11px;color:var(--mu)}
.lang button.on{background:var(--s3);color:var(--gold2)}
.sec-w{max-width:1120px;margin:0 auto;padding:0 16px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:70px 0 50px}
.tag{display:inline-block;padding:4px 12px;border:1px solid var(--ln);border-radius:999px;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.hero h1{font-size:44px;line-height:1.08;font-weight:800;margin:16px 0 14px}
.hero h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1.4px var(--gold)}
.hero p{color:var(--mu);font-size:15px;max-width:540px}
.hero .ctas{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills span{font-size:11.5px;padding:5px 11px;border-radius:999px;background:rgba(18,27,51,.7);border:1px solid var(--ln);color:#C8D1E6}
.hero svg{width:100%;height:auto;display:block}
.blk{padding:56px 0}
.blk h2{font-size:28px;font-weight:800;margin-bottom:6px}
.blk .sub{color:var(--mu);margin-bottom:24px;font-size:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:rgba(12,19,38,.78);border:1px solid var(--ln);border-radius:16px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
.svc .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--s3);color:var(--gold);font-size:16px;margin-bottom:10px}
.svc h3{font-size:14px;font-weight:600;margin-bottom:4px}
.svc p{color:var(--mu);font-size:12.5px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s}
.steps .card h3{font-size:14px;margin:6px 0 4px}
.steps .card p{color:var(--mu);font-size:12.5px}
.steps .n{font-size:30px;font-weight:900;color:transparent;-webkit-text-stroke:1px var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.chk{list-style:none;display:grid;gap:8px}
.chk li{padding-left:24px;position:relative;color:#C8D1E6}
.chk li:before{content:"✓";position:absolute;left:0;color:var(--teal);font-weight:700}
.routes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.routes span{padding:6px 12px;border-radius:999px;border:1px solid var(--gold);color:var(--gold2);font-size:12px}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cform .full{grid-column:1/-1}
.cform label{display:block;font-size:11px;color:var(--mu);margin-bottom:3px}
.sfoot{border-top:1px solid var(--ln);padding:22px 0 calc(22px + env(safe-area-inset-bottom));color:var(--mu);font-size:12px;margin-top:30px}
.sfoot .sec-w{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ============ FORM ============ */
.in,.fld input:not([type=checkbox]):not([type=file]),.fld select,.fld textarea,.cform input,.cform select,.cform textarea{width:100%;min-height:36px;padding:7px 11px;border-radius:10px;background:var(--s1);border:1px solid var(--ln);outline:none;font-size:13px}
.fld textarea,.cform textarea{min-height:80px;resize:vertical}
.in:focus,.fld input:focus,.fld select:focus,.fld textarea:focus,.cform input:focus,.cform select:focus,.cform textarea:focus{border-color:var(--gold)}
.fld{margin-bottom:11px;min-width:0}
.fld>label{display:block;font-size:11px;color:var(--mu);margin-bottom:4px;font-weight:500}
.fld .req{color:var(--gold)}
.fld .conf{font-size:11px;color:var(--teal);margin-top:3px;min-height:14px}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--red)}
.fld .emsg{color:var(--red);font-size:11px;margin-top:3px}
.pick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.pb{padding:5px 11px;border-radius:999px;border:1px solid var(--ln);background:var(--s1);font-size:12px;color:#C8D1E6;min-height:30px}
.pb.on{background:rgba(217,180,106,.16);border-color:var(--gold);color:var(--gold2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inline-new{border:1px dashed var(--gold);border-radius:12px;padding:12px;margin:-4px 0 12px;background:rgba(217,180,106,.05)}
.inline-new h4{font-size:12px;color:var(--gold2);margin-bottom:8px}

/* ============ ERP ============ */
#erp{position:relative;z-index:1}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth .card{width:100%;max-width:380px;padding:26px}
.auth .logo{font-size:24px;display:block;text-align:center;margin-bottom:4px}
.auth .sm{color:var(--mu);text-align:center;margin-bottom:18px;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:7px;border-radius:999px;border:1px solid var(--ln);color:var(--mu);font-size:12px}
.tabs button.on{background:var(--s3);color:var(--gold2);border-color:var(--gold)}
.app{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:16px 10px;background:rgba(12,19,38,.82);border-right:1px solid var(--ln);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.side .logo{font-size:16px;padding:2px 8px 14px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--mu);text-align:left;width:100%}
.nv .ic{width:18px;text-align:center;font-size:14px}
.nv small{display:block;font-size:9.5px;opacity:.6;letter-spacing:.5px;line-height:1}
.nv span{line-height:1.15;font-size:12.5px}
.nv:hover{background:var(--s2);color:var(--tx)}
.nv.on{background:rgba(217,180,106,.12);color:var(--gold2)}
.nv .bd{margin-left:auto;background:var(--gold);color:#1A1405;border-radius:999px;font-size:10px;font-weight:700;padding:0 6px}
.side .me{margin-top:auto;font-size:11px;color:var(--mu);padding:10px 8px;border-top:1px solid var(--ln)}
.main{min-width:0;padding:16px 20px calc(80px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:800;line-height:1.1}
.top h1 small{display:block;font-size:10px;color:var(--mu);font-weight:500;letter-spacing:1.5px;text-transform:uppercase}
.top .sp{flex:1}
.banner{position:relative;overflow:hidden;border-radius:16px;padding:16px 18px;margin-bottom:12px;background:linear-gradient(120deg,#0E2142 0%,#14284B 45%,#3A2C10 100%);border:1px solid var(--ln)}
.banner h2{font-size:17px;font-weight:700}
.banner p{color:#C8D1E6;font-size:12px;max-width:520px}
.banner svg{position:absolute;right:-10px;bottom:-14px;width:260px;opacity:.45}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:12px 14px;cursor:pointer}
.kpi .l{font-size:11px;color:var(--mu)}
.kpi .v{font-size:24px;font-weight:800;line-height:1.2}
.kpi .h{font-size:10.5px;color:var(--mu)}
.kpi.warn .v{color:var(--amber)}.kpi.bad .v{color:var(--red)}.kpi.ok .v{color:var(--teal)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;align-items:start}
.card h3.t{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3.t small{color:var(--mu);font-weight:400}
.tsc{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
.tb th{text-align:left;font-weight:500;color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.tb td{padding:8px;border-bottom:1px solid rgba(34,48,79,.55);vertical-align:middle}
.tb tr.cl{cursor:pointer}
.tb tr.cl:hover td{background:rgba(24,35,63,.6)}
.num{font-weight:700;color:var(--gold2);white-space:nowrap;font-size:11.5px}
.mut{color:var(--mu)}
.s11{font-size:11px}
.prog{display:flex;gap:3px;min-width:90px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--s3)}
.prog i.on{background:var(--gold)}
.prog.done i{background:var(--teal)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;border:1px solid var(--ln);color:#C8D1E6;white-space:nowrap}
.chip.g{border-color:var(--gold);color:var(--gold2)}
.chip.t{border-color:var(--teal);color:var(--teal)}
.chip.r{border-color:var(--red);color:var(--red)}
.chip.a{border-color:var(--amber);color:var(--amber)}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--s3);font-size:10px;font-weight:700;color:var(--gold2);flex:none}
.list .it{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid rgba(34,48,79,.55);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it b{font-weight:600}
.empty{text-align:center;color:var(--mu);padding:22px 10px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.filters .in{width:220px;min-height:32px}
.filters select.in{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:10.5px}
.cal .h{color:var(--mu);font-size:9.5px}
.cal .d{padding:4px 0;border-radius:6px;position:relative}
.cal .d.hj{background:var(--gold);color:#1A1405;font-weight:700}
.cal .d.dot:after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--teal)}
.cal .d.late:after{background:var(--red)}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:600}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:rgba(12,19,38,.6);border:1px solid var(--ln);border-radius:14px;padding:10px;min-height:120px}
.kcol h4{font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.kcard{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:9px;margin-bottom:7px;cursor:pointer}
.kcard:hover{border-color:var(--gold)}
.phead{padding:14px 16px;margin-bottom:12px}
.phead .ttl{font-size:18px;font-weight:700;line-height:1.25;margin:2px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:#C8D1E6}
.meta b{color:var(--mu);font-weight:500;margin-right:4px}
.etapas{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.etapas button{padding:5px 11px;border-radius:999px;border:1px solid var(--ln);font-size:11.5px;color:var(--mu)}
.etapas button.past{border-color:#5B4A22;color:#BFA46A}
.etapas button.on{background:var(--gold);color:#1A1405;border-color:var(--gold);font-weight:600}
.ptabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ptabs button{padding:6px 14px;border-radius:999px;border:1px solid var(--ln);color:var(--mu);font-size:12px}
.ptabs button.on{background:var(--s3);color:var(--gold2);border-color:var(--gold)}
.comp textarea{width:100%;min-height:70px;padding:9px 11px;border-radius:10px;background:var(--s1);border:1px solid var(--ln);outline:none;resize:vertical}
.comp textarea:focus{border-color:var(--gold)}
.comp .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.attach{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.attach span{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--s3)}
.drop{border:1.5px dashed var(--ln);border-radius:14px;padding:22px;text-align:center;color:var(--mu);cursor:pointer;transition:.15s}
.drop.ov,.comp.ov{border-color:var(--gold);background:rgba(217,180,106,.06)}
.drop b{color:var(--gold2)}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--ln)}
.ev{position:relative;padding:0 0 14px}
.ev:before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.ev.sys:before{background:var(--s3);border:1px solid var(--mu)}
.ev .eh{font-size:11px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ev .et{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.ev.sys .et{color:var(--mu);font-size:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.th{width:74px;height:74px;border-radius:10px;overflow:hidden;background:var(--s3);display:grid;place-items:center;font-size:10px;color:var(--mu);cursor:pointer;border:1px solid var(--ln);text-align:center;padding:2px;word-break:break-all}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.fcard{background:var(--s2);border:1px solid var(--ln);border-radius:12px;overflow:hidden;min-width:0}
.fcard .pv{height:110px;background:var(--s3);display:grid;place-items:center;cursor:pointer;font-size:26px;color:var(--gold)}
.fcard .pv img,.fcard .pv video{width:100%;height:100%;object-fit:cover}
.fcard .fi{padding:7px 9px;font-size:11px}
.fcard .fi .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:11.5px}
.fcard .fa{display:flex;gap:4px;padding:0 9px 8px}
.ov{position:fixed;inset:0;z-index:100;background:rgba(3,5,12,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px calc(24px + env(safe-area-inset-bottom))}
.md{width:100%;max-width:680px;background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:18px}
.md.wide{max-width:920px}
.md .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.md .mh h3{font-size:15px;font-weight:700;flex:1}
.md .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--s3);border:1px solid var(--gold);padding:9px 16px;border-radius:999px;z-index:200;font-size:12.5px;max-width:92vw;text-align:center}
.toast.err{border-color:var(--red);color:#FFD0D0}
.bnav{display:none}
.viewer img,.viewer video{max-width:100%;max-height:72vh;display:block;margin:0 auto;border-radius:10px}
.pending{max-width:420px}
.prev td,.prev th{font-size:11px}
.demobar{position:sticky;top:0;z-index:45;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-16px -20px 12px;padding:8px 20px;background:linear-gradient(90deg,#5A3E0A,#3A2C10);border-bottom:1px solid var(--gold);color:var(--gold2);font-size:12px;font-weight:500}
.demobar .btn{margin-left:auto}
@media (max-width:980px){.demobar{margin:-12px -12px 10px;padding:8px 12px}}
.warnbox{background:rgba(245,181,71,.08);border:1px solid #6B5322;border-radius:10px;padding:8px 11px;color:#F2D49A;font-size:12px;margin-bottom:10px}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;padding:40px 0 20px}.hero h1{font-size:32px}
  .grid4,.steps{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}
  .snav .links{display:none}.snav .lang{margin-left:auto}
  .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
  .main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(12,19,38,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--mu);min-height:44px;justify-content:center}
  .bnav button .ic{font-size:16px}
  .bnav button.on{color:var(--gold2)}
  .bnav .plus .ic{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1A1405;display:grid;place-items:center;font-size:20px;font-weight:700}
  .hm{display:none}
  .filters .in{width:100%}
}
@media (max-width:560px){

}

function pick(name, label, val, opts, o = {}) {
  const v = val ?? '';

  return `<div class="fld" data-f="${name}"><label>${label}${o.req ? ' <span class="req">*</span>' : ''}</label>
    <div class="pick" data-for="${name}" ${multi ? 'data-multi' : ''}>${opts.map(x => `<button type="button" class="pb ${sel.includes(String(x)) ? 'on' : ''}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    ${o.only ? `<input type="hidden" name="${name}" value="${esc(v)}">` : `<input name="${name}" value="${esc(v)}" placeholder="${esc(o.ph || (multi ? 'ou digite, separando por vírgula…' : 'ou digite…'))}" ${o.num ? 'inputmode="decimal"' : ''}>`}</div>`;
}
function datePick(name, label, val, offs) {
  return `<div class="fld" data-f="${name}"><label>${label}</label>
    <div class="pick" data-dfor="${name}">${offs.map(([t, n]) => `<button type="button" class="pb ${val && val === addDias(n) ? 'on' : ''}" data-d="${n}">${t}</button>`).join('')}</div>
    <input type="date" name="${name}" value="${esc(val || '')}"><div class="conf">${val ? '→ ' + fData(val) : ''}</div></div>`;
}
function fld(name, label, val, o = {}) {
  const t = o.type || 'text';
  return `<div class="fld" data-f="${name}"><label>${label}${o.req ? ' <span class="req">*</span>' : ''}</label>${t === 'textarea' ? `<textarea name="${name}" placeholder="${esc(o.ph || '')}">${esc(val || '')}</textarea>` : `<input type="${t}" name="${name}" value="${esc(val ?? '')}" placeholder="${esc(o.ph || '')}" ${o.num ? 'inputmode="decimal"' : ''} ${o.list ? `list="${o.list}"` : ''}>`}${t === 'date' ? `<div class="conf">${val ? '→ ' + fData(val) : ''}</div>` : ''}</div>`;
}
function marcaPicks(root) {
  $$('.pick[data-for]', root).forEach(pk => {
    const inp = root.querySelector(`[name="${pk.dataset.for}"]`); if (!inp) return;
    const sel = pk.hasAttribute('data-multi') ? inp.value.split(',').map(s => s.trim().toLowerCase()) : [inp.value.trim().toLowerCase()];
    $$('.pb', pk).forEach(b => b.classList.toggle('on', sel.includes(b.dataset.v.toLowerCase())));
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('.pb'); if (!b) return;
  const pk = b.parentElement, form = b.closest('form') || document;
  if (pk.dataset.for) {
    const inp = form.querySelector(`[name="${pk.dataset.for}"]`); if (!inp) return;
    if (pk.hasAttribute('data-multi')) {
      let arr = inp.value.split(',').map(s => s.trim()).filter(Boolean);
      arr = arr.some(x => x.toLowerCase() === b.dataset.v.toLowerCase()) ? arr.filter(x => x.toLowerCase() !== b.dataset.v.toLowerCase()) : [...arr, b.dataset.v];
      inp.value = arr.join(', ');
    } else inp.value = b.classList.contains('on') && pk.hasAttribute('data-toggle') ? '' : b.dataset.v;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  } else if (pk.dataset.dfor) {
    const inp = form.querySelector(`[name="${pk.dataset.dfor}"]`); inp.value = addDias(Number(b.dataset.d));
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  }
});
document.addEventListener('input', e => {

/* =================== ERP · MODAL =================== */
function modal(title, body, { wide, saveTxt = 'Salvar', onSave, extra = '', noSave } = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<form class="md ${wide ? 'wide' : ''}" novalidate><div class="mh"><h3>${title}</h3></div><div class="mb">${body}</div>
    <div class="mf">${extra}<span style="flex:1"></span><button type="button" class="btn sec" data-close>Fechar</button>${noSave ? '' : `<button class="btn" data-save>${saveTxt}</button>`}</div></form>`;
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  const form = ov.querySelector('form'); let sujo = false, armado = false;
  form.addEventListener('input', () => sujo = true);
  const fechar = () => { ov.remove(); if (!$('.ov')) document.body.style.overflow = ''; };
  ov.addEventListener('mousedown', e => { if (e.target === ov) { form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); } });
  ov._esc = e => { if (e.key === 'Escape' && $$('.ov').pop() === ov) { e.preventDefault(); form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); } };
  document.addEventListener('keydown', ov._esc);
  const bc = form.querySelector('[data-close]');
  bc.onclick = () => { if (sujo && !armado) { armado = true; bc.textContent = 'Fechar sem salvar?'; bc.classList.add('red', 'arm'); setTimeout(() => { armado = false; bc.textContent = 'Fechar'; bc.classList.remove('red', 'arm'); }, 3000); return; } document.removeEventListener('keydown', ov._esc); fechar(); };
  form.onsubmit = async e => {
    e.preventDefault(); if (!onSave) return;
    const bs = form.querySelector('[data-save]'); if (bs) bs.disabled = true;
    try { const ok = await onSave(form); if (ok !== false) { document.removeEventListener('keydown', ov._esc); fechar(); if (S.me && !$('.ov')) render(); } }
    catch (err) { toast(errMsg(err), true); }
    finally { if (bs) bs.disabled = false; }
  };
  return { ov, form, fechar: () => { document.removeEventListener('keydown', ov._esc); fechar(); } };
}
function armar(btn, txt, fn) {
  btn.addEventListener('click', async e => {
    e.preventDefault();
    if (!btn.dataset.arm) { btn.dataset.arm = btn.textContent; btn.textContent = txt; btn.classList.add('arm'); setTimeout(() => { if (btn.dataset.arm) { btn.textContent = btn.dataset.arm; delete btn.dataset.arm; btn.classList.remove('arm'); } }, 3000); return; }
    delete btn.dataset.arm; btn.classList.remove('arm'); btn.disabled = true;
    try { await fn(); } catch (err) { toast(errMsg(err), true); } finally { btn.disabled = false; }
  });
}

function miniCal() {
  const d = S.cal, a = d.getFullYear(), m = d.getMonth(), prim = new Date(a, m, 1).getDay(), nd = new Date(a, m + 1, 0).getDate();
  const marc = {}; ativos().forEach(p => { [p.proximo_em, p.prazo].forEach(x => { if (x) { (marc[x] = marc[x] || []).push(p); } }); });
  let h = `<div class="calh"><button class="pb" data-cal="-1">‹</button><span>${MESL[m]} ${a}</span><button class="pb" data-cal="1">›</button></div><div class="cal">${'DSTQQSS'.split('').map(x => `<div class="h">${x}</div>`).join('')}`;
  for (let i = 0; i < prim; i++) h += '<div></div>';

/* =================== ERP · PROCESSOS =================== */
function vProcessos(el) {
  const f = S.f;
  let l = S.processos.filter(p => p.status === 'ativo' && p.etapa !== 'concluido');
  if (f.etapa) l = l.filter(p => p.etapa === f.etapa);
  if (f.resp) l = l.filter(p => p.responsavel === f.resp || (p.equipe || []).includes(f.resp));
  if (f.minha) l = l.filter(p => p.responsavel === S.user.id || (p.equipe || []).includes(S.user.id));
  if (f.alerta === 'sem') l = l.filter(p => (diasDesde(p.ultimo_contato) ?? 99) >= 7);
  if (f.alerta === 'venc') l = l.filter(p => p.proximo_em && diasDesde(p.proximo_em) >= 0);
  if (f.q) { const t = f.q.toLowerCase(); l = l.filter(p => [p.numero, p.titulo, (cliDe(p.cliente_id) || {}).nome, p.origem, p.destino, (p.tipos || []).join(' '), p.descricao, p.proximo_passo].join(' ').toLowerCase().includes(t)); }
  el.innerHTML = topo('Processos', 'Cases', `<div class="tabs" style="margin:0"><button data-modo="lista" class="${f.modo === 'lista' ? 'on' : ''}">Lista</button><button data-modo="quadro" class="${f.modo === 'quadro' ? 'on' : ''}">Quadro</button></div>${editor() ? '<button class="btn" data-n>＋ Novo</button>' : ''}`) +
    `<div class="filters"><input class="in" id="fq" placeholder="Buscar nº, cliente, produto, país…" value="${esc(f.q)}">
      ${f.modo === 'lista' ? `<button class="pb ${!f.etapa ? 'on' : ''}" data-et="">Todas</button>${ETAPAS.slice(0, 4).map(([k, n]) => `<button class="pb ${f.etapa === k ? 'on' : ''}" data-et="${k}">${n}</button>`).join('')}` : ''}
      <select class="in" id="fr"><option value="">Todos os responsáveis</option>${S.membros.filter(m => m.status === 'ativo').map(m => `<option value="${m.user_id}" ${f.resp === m.user_id ? 'selected' : ''}>${esc(m.nome || m.email)}</option>`).join('')}</select>
      <button class="pb ${f.minha ? 'on' : ''}" id="fm">Minha carteira</button>
      ${f.alerta ? `<button class="pb on" id="fa">${f.alerta === 'sem' ? 'Sem contato 7+ d' : 'Próx. passo vencido'} ✕</button>` : ''}
      <span class="s11 mut">${l.length} processo(s)</span></div>
    <div id="plist">${f.modo === 'quadro' ? quadro(l) : `<div class="card">${tabelaProc(l)}</div>`}</div>`;
  ligaComum(el);
  const fq = $('#fq'); fq.oninput = () => { S.f.q = fq.value; const pos = fq.selectionStart; vProcessos(el); const n = $('#fq'); n.focus(); n.setSelectionRange(pos, pos); };
  $$('[data-et]', el).forEach(b => b.onclick = () => { S.f.etapa = b.dataset.et; vProcessos(el); });
  $$('[data-modo]', el).forEach(b => b.onclick = () => { S.f.modo = b.dataset.modo; lsSet('nb-modo', S.f.modo); vProcessos(el); });
  $('#fr').onchange = e => { S.f.resp = e.target.value; vProcessos(el); };
  $('#fm').onclick = () => { S.f.minha = !S.f.minha; vProcessos(el); };
  const fa = $('#fa'); if (fa) fa.onclick = () => { S.f.alerta = ''; vProcessos(el); };
}
function quadro(l) {

function ligaFormProc(form) {
  const sel = form.cliente_id, box = $('#novoCli', form);
  const t = () => { box.hidden = sel.value !== '__novo'; if (!box.hidden) form.nc_nome.focus(); };
  sel.addEventListener('change', t); t();
  if (form.fornecedores) {
    const chips = () => { const ids = form.fornecedores.value.split(',').filter(Boolean); $('#fornChips', form).innerHTML = ids.map(i => `<button type="button" class="pb on" data-rf="${i}">${esc((fornDe(i) || {}).empresa || '?')} ✕</button>`).join('') || '<span class="s11 mut">Nenhum</span>'; };
    $('#addForn', form).addEventListener('change', e => { const v = e.target.value; if (v) { const ids = form.fornecedores.value.split(',').filter(Boolean); if (!ids.includes(v)) ids.push(v); form.fornecedores.value = ids.join(','); chips(); form.dispatchEvent(new Event('input')); } e.target.value = ''; });
    $('#fornChips', form).addEventListener('click', e => { const b = e.target.closest('[data-rf]'); if (!b) return; form.fornecedores.value = form.fornecedores.value.split(',').filter(x => x && x !== b.dataset.rf).join(','); chips(); form.dispatchEvent(new Event('input')); });

function cnpjValido(v) {
  const s = String(v || '').toUpperCase().replace(/[^0-9A-Z]/g, ''); if (s.length !== 14 || /^(\d)\1+$/.test(s)) return false;
  if (!/^\d{2}$/.test(s.slice(12))) return false;
  const val = ch => ch.charCodeAt(0) - 48;
  const dv = (base, pesos) => { const sm = base.split('').reduce((a, ch, i) => a + val(ch) * pesos[i], 0); const r = sm % 11; return r < 2 ? 0 : 11 - r; };
  const d1 = dv(s.slice(0, 12), [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]), d2 = dv(s.slice(0, 12) + d1, [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]);
  return s.slice(12) === '' + d1 + d2;
}

function demoClient(DB, me) {

    const api = {

      eq(k, v) { filters.push([k, v]); return api; }, order(k, o) { ord = [k, !!(o && o.ascending === false)]; return api; }, limit(n) { lim = n; return api; }, single() { single = true; return api; },
      then(res) { try { res(run()); } catch (e) { res({ data: null, error: { message: String(e.message || e) } }); } }
    };

          const r = { id: uid(), created_at: now(), ...clone(x) };
          if (t === 'nb_processos') { seq++; r.seq = seq; r.numero = 'NB-' + new Date().getFullYear() + '-' + String(seq).padStart(4, '0'); r.status = 'ativo'; r.etapa = r.etapa || 'lead'; r.ultimo_contato = now(); r.created_by = me; r.updated_at = now(); }
          if (t === 'nb_eventos') { r.autor = me; r.autor_nome = nomeMe(); r.data_evento = r.data_evento || r.created_at; }
          if (t === 'nb_clientes') r.status = 'ativo';
          if (t === 'nb_fornecedores') { r.status = r.status || 'Novo'; r.trazido_por = me; }
          if (t === 'nb_arquivos') r.autor = me;

          if (t === 'nb_eventos' && r.tipo !== 'Sistema') { const p = DB.nb_processos.find(z => z.id === r.processo_id); if (p && (!p.ultimo_contato || p.ultimo_contato < r.data_evento)) p.ultimo_contato = r.data_evento; }
          return r;
        });

      }
      if (mode === 'update') {

          if (t === 'nb_processos') {
            const msg = [];
            if (payload.etapa && payload.etapa !== r.etapa) { msg.push('Etapa: ' + ETN[r.etapa] + ' → ' + ETN[payload.etapa] + '.'); r.concluido_em = payload.etapa === 'concluido' ? now() : null; }

            if ('responsavel' in payload && payload.responsavel !== r.responsavel) msg.push('Responsável: ' + nomeDe(r.responsavel) + ' → ' + nomeDe(payload.responsavel) + '.');
            if ('honorario' in payload && payload.honorario !== r.honorario) msg.push('Honorário: ' + (r.honorario ?? '—') + ' → ' + (payload.honorario ?? '—') + ' ' + (payload.moeda || r.moeda || '') + '.');
            if (msg.length) ev(r.id, 'Sistema', msg.join(' '));
            r.updated_at = now();
          }
          Object.assign(r, clone(payload));
        });
        return { data: null, error: null };
      }
      let rows = T.filter(match).map(clone);
      if (ord) rows.sort((a, b) => String(a[ord[0]] ?? '').localeCompare(String(b[ord[0]] ?? '')) * (ord[1] ? -1 : 1));
      if (lim) rows = rows.slice(0, lim);

    }

  }

    from: qb,

    auth: sbReal.auth
